name: 'hermeto-prefetch'
description: 'Pre-fetch dependencies for hermetic builds using Hermeto'

inputs:
  packages:
    required: true
    description: 'JSON package config for hermeto fetch-deps. Single object or array, e.g. [{"type":"pnpm","path":"."},{"type":"generic","path":"."}]'
  source:
    required: false
    description: 'Path to the source directory'
    default: '.'
  output-dir:
    required: false
    description: 'Host path for Hermeto output'
    default: './hermeto-output'
  container-output-dir:
    required: false
    description: 'Mount target inside the build container. Defaults to /cachi2/output for Containerfile compatibility with Konflux/Cachi2.'
    default: '/cachi2/output'
  hermeto-image:
    required: false
    description: 'Hermeto container image'
    default: 'ghcr.io/hermetoproject/hermeto:latest'

outputs:
  output-dir:
    value: ${{ steps.set-outputs.outputs.output-dir }}
    description: 'Absolute path to the Hermeto output directory'
  env-file:
    value: ${{ steps.set-outputs.outputs.env-file }}
    description: 'Absolute path to the generated environment file'
  sbom:
    value: ${{ steps.set-outputs.outputs.sbom }}
    description: 'Absolute path to the generated SBOM (bom.json)'
  extra-args:
    value: ${{ steps.set-outputs.outputs.extra-args }}
    description: 'Pre-formatted extra-args for oci-build (volume mounts + --network none)'

runs:
  using: "composite"
  steps:
    - name: Pull Hermeto image
      shell: bash
      run: podman pull ${{ inputs.hermeto-image }}

    - name: Fetch dependencies
      shell: bash
      run: |
        set -euo pipefail

        # Convert JSON input to positional arguments for hermeto fetch-deps
        ARGS=$(echo '${{ inputs.packages }}' | python3 -c "
        import json, sys
        data = json.load(sys.stdin)
        # Normalize to array
        if isinstance(data, dict):
            data = [data]
        for item in data:
            print(json.dumps(item))
        ")

        podman run --rm \
          -v "$PWD:$PWD:z" \
          -w "$PWD" \
          ${{ inputs.hermeto-image }} \
          fetch-deps \
            --source "${{ inputs.source }}" \
            --output "${{ inputs.output-dir }}" \
            $ARGS

    - name: Generate environment file
      shell: bash
      run: |
        set -euo pipefail

        podman run --rm \
          -v "$PWD:$PWD:z" \
          -w "$PWD" \
          ${{ inputs.hermeto-image }} \
          generate-env "${{ inputs.output-dir }}" \
            -o "${{ inputs.output-dir }}/hermeto.env" \
            --for-output-dir "${{ inputs.container-output-dir }}"

    - name: Inject files
      shell: bash
      run: |
        set -euo pipefail

        podman run --rm \
          -v "$PWD:$PWD:z" \
          -w "$PWD" \
          ${{ inputs.hermeto-image }} \
          inject-files "${{ inputs.output-dir }}" \
            --for-output-dir "${{ inputs.container-output-dir }}"

    - name: Set outputs
      id: set-outputs
      shell: bash
      run: |
        set -euo pipefail

        OUTPUT_DIR="$(realpath "${{ inputs.output-dir }}")"
        ENV_FILE="${OUTPUT_DIR}/hermeto.env"
        CONTAINER_OUTPUT_DIR="${{ inputs.container-output-dir }}"

        echo "output-dir=${OUTPUT_DIR}" >> "$GITHUB_OUTPUT"
        echo "env-file=${ENV_FILE}" >> "$GITHUB_OUTPUT"
        echo "sbom=${OUTPUT_DIR}/bom.json" >> "$GITHUB_OUTPUT"

        # Assemble extra-args for buildah-build
        {
          echo "extra-args<<EXTRA_ARGS_EOF"
          echo "--volume ${OUTPUT_DIR}:${CONTAINER_OUTPUT_DIR}:Z"
          echo "--volume ${ENV_FILE}:/tmp/hermeto.env:Z"
          echo "--network none"
          echo "EXTRA_ARGS_EOF"
        } >> "$GITHUB_OUTPUT"
